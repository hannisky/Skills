<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" width="520" height="760" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <style>
      .bed-label { font-size: 11px; font-weight: 600; fill: #2c3e50; }
      .bed-sub { font-size: 9px; fill: #555; }
      .dim-text { font-size: 8px; fill: #888; }
      .zone-label { font-size: 9px; fill: #777; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #2c3e50; }
      .subtitle { font-size: 10px; fill: #666; }
      .compass { font-size: 11px; font-weight: 700; fill: #2c3e50; }
      .legend-text { font-size: 9px; fill: #444; }
    </style>
    <pattern id="path-pattern" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#d4c9a8"/>
      <circle cx="2" cy="2" r="0.5" fill="#c4b998"/>
      <circle cx="6" cy="6" r="0.5" fill="#c4b998"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="520" height="760" fill="#f5f2eb" rx="6"/>

  <!-- Title -->
  <text x="260" y="30" text-anchor="middle" class="title">Jardin -- Garden Layout 2026</text>
  <text x="260" y="46" text-anchor="middle" class="subtitle">6 m x 10 m -- Zone 4 -- Northern Scandinavia</text>

  <!-- Compass -->
  <g transform="translate(475, 90)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#aaa" stroke-width="0.5"/>
    <text x="0" y="-22" text-anchor="middle" class="compass">N</text>
    <polygon points="0,-16 -4,-6 4,-6" fill="#2c3e50"/>
    <polygon points="0,16 -4,6 4,6" fill="#ccc" stroke="#999" stroke-width="0.3"/>
    <text x="0" y="30" text-anchor="middle" class="dim-text">S</text>
    <text x="-26" y="4" text-anchor="middle" class="dim-text">W</text>
    <text x="26" y="4" text-anchor="middle" class="dim-text">E</text>
  </g>

  <!-- Garden boundary -->
  <rect x="80" y="80" width="360" height="600" fill="url(#path-pattern)" stroke="#6b5b3e" stroke-width="2" rx="2"/>

  <!-- Direction labels -->
  <text x="260" y="74" text-anchor="middle" class="zone-label">NORTH (rear)</text>
  <text x="260" y="698" text-anchor="middle" class="zone-label">SOUTH (front)</text>
  <text x="72" y="380" text-anchor="middle" class="zone-label" transform="rotate(-90, 72, 380)">WEST (fence)</text>
  <text x="448" y="380" text-anchor="middle" class="zone-label" transform="rotate(90, 448, 380)">EAST (entrance)</text>

  <!-- North buffer -->
  <rect x="81" y="81" width="358" height="58" fill="#e8e2d4" fill-opacity="0.5"/>
  <text x="260" y="115" text-anchor="middle" class="dim-text">buffer / access (1 m)</text>

  <!-- Allium Bed (west, 2x2) -->
  <rect x="85" y="145" width="120" height="110" fill="#e8d5e8" stroke="#9b59b6" stroke-width="1.5" rx="4"/>
  <text x="145" y="190" text-anchor="middle" class="bed-label">Allium Bed</text>
  <text x="145" y="204" text-anchor="middle" class="bed-sub">shallot -- garlic</text>
  <text x="145" y="218" text-anchor="middle" class="dim-text">2 x 2 m</text>

  <!-- Open area east of allium -->
  <rect x="210" y="145" width="225" height="110" fill="none" stroke="#bbb" stroke-width="0.5" stroke-dasharray="4,3" rx="2"/>
  <text x="322" y="205" text-anchor="middle" class="dim-text">(open area)</text>

  <!-- Brassica Bed (west, 2x5) -->
  <rect x="85" y="265" width="120" height="290" fill="#a8d5a2" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="145" y="390" text-anchor="middle" class="bed-label">Brassica Bed</text>
  <text x="145" y="406" text-anchor="middle" class="bed-sub">cabbage -- kale</text>
  <text x="145" y="420" text-anchor="middle" class="bed-sub">broccoli -- kohlrabi</text>
  <text x="145" y="436" text-anchor="middle" class="bed-sub">+ greens trial</text>
  <text x="145" y="454" text-anchor="middle" class="dim-text">2 x 5 m</text>

  <!-- Central Path -->
  <rect x="210" y="145" width="120" height="410" fill="#d4c9a8" fill-opacity="0.6" stroke="#b8a97e" stroke-width="0.8" stroke-dasharray="6,3" rx="2"/>
  <text x="270" y="400" text-anchor="middle" class="dim-text" transform="rotate(-90, 270, 400)">PATH (2 m wide)</text>

  <!-- Root Bed A (east, 1x5) -->
  <rect x="335" y="265" width="48" height="290" fill="#f0d9a0" stroke="#e67e22" stroke-width="1.5" rx="4"/>
  <text x="359" y="395" text-anchor="middle" class="bed-label" transform="rotate(-90, 359, 395)">Root Bed A -- potato</text>
  <text x="359" y="540" text-anchor="middle" class="dim-text">1x5</text>

  <!-- Root Bed B (east, 1x5) -->
  <rect x="388" y="265" width="48" height="290" fill="#f5c6a0" stroke="#d35400" stroke-width="1.5" rx="4"/>
  <text x="412" y="395" text-anchor="middle" class="bed-label" transform="rotate(-90, 412, 395)">Root Bed B -- carrot/parsnip</text>
  <text x="412" y="540" text-anchor="middle" class="dim-text">1x5</text>

  <!-- Trellis zone -->
  <rect x="81" y="565" width="358" height="110" fill="#d6e8f0" fill-opacity="0.5" stroke="#5b9bd5" stroke-width="1" stroke-dasharray="8,4" rx="3"/>
  <text x="260" y="583" text-anchor="middle" class="bed-sub" style="fill:#3a7cbd;">TRELLIS (spans 6 m)</text>

  <!-- RB 1 -->
  <rect x="108" y="596" width="54" height="65" fill="#b8d8e8" stroke="#3a7cbd" stroke-width="1.2" rx="3"/>
  <text x="135" y="624" text-anchor="middle" class="bed-label" style="font-size:9px;">RB 1</text>
  <text x="135" y="638" text-anchor="middle" class="bed-sub">mache</text>

  <!-- RB 2 -->
  <rect x="233" y="596" width="54" height="65" fill="#b8d8e8" stroke="#3a7cbd" stroke-width="1.2" rx="3"/>
  <text x="260" y="624" text-anchor="middle" class="bed-label" style="font-size:9px;">RB 2</text>
  <text x="260" y="638" text-anchor="middle" class="bed-sub">rocket</text>

  <!-- RB 3 -->
  <rect x="358" y="596" width="54" height="65" fill="#b8d8e8" stroke="#3a7cbd" stroke-width="1.2" rx="3"/>
  <text x="385" y="624" text-anchor="middle" class="bed-label" style="font-size:9px;">RB 3</text>
  <text x="385" y="638" text-anchor="middle" class="bed-sub">microgreens</text>

  <!-- Dimension lines -->
  <line x1="80" y1="695" x2="440" y2="695" stroke="#888" stroke-width="0.7"/>
  <line x1="80" y1="690" x2="80" y2="700" stroke="#888" stroke-width="0.7"/>
  <line x1="440" y1="690" x2="440" y2="700" stroke="#888" stroke-width="0.7"/>
  <text x="260" y="710" text-anchor="middle" class="dim-text">6 m</text>

  <line x1="455" y1="80" x2="455" y2="680" stroke="#888" stroke-width="0.7"/>
  <line x1="450" y1="80" x2="460" y2="80" stroke="#888" stroke-width="0.7"/>
  <line x1="450" y1="680" x2="460" y2="680" stroke="#888" stroke-width="0.7"/>
  <text x="470" y="384" text-anchor="middle" class="dim-text" transform="rotate(90, 470, 384)">10 m</text>

  <!-- Legend -->
  <g transform="translate(80, 720)">
    <rect x="0" y="0" width="360" height="30" fill="#f5f2eb" stroke="#ccc" stroke-width="0.5" rx="3"/>
    <rect x="8" y="8" width="12" height="12" fill="#a8d5a2" stroke="#27ae60" stroke-width="0.8" rx="2"/>
    <text x="24" y="18" class="legend-text">Brassica</text>
    <rect x="72" y="8" width="12" height="12" fill="#e8d5e8" stroke="#9b59b6" stroke-width="0.8" rx="2"/>
    <text x="88" y="18" class="legend-text">Allium</text>
    <rect x="127" y="8" width="12" height="12" fill="#f0d9a0" stroke="#e67e22" stroke-width="0.8" rx="2"/>
    <text x="143" y="18" class="legend-text">Root A</text>
    <rect x="184" y="8" width="12" height="12" fill="#f5c6a0" stroke="#d35400" stroke-width="0.8" rx="2"/>
    <text x="200" y="18" class="legend-text">Root B</text>
    <rect x="243" y="8" width="12" height="12" fill="#b8d8e8" stroke="#3a7cbd" stroke-width="0.8" rx="2"/>
    <text x="259" y="18" class="legend-text">Trellis</text>
    <rect x="303" y="8" width="12" height="12" fill="#d4c9a8" stroke="#b8a97e" stroke-width="0.8" rx="2"/>
    <text x="319" y="18" class="legend-text">Path</text>
  </g>
</svg>
