<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1100" viewBox="0 0 700 1100">
  <style>
    .label { font: 14px Arial, sans-serif; fill: #1a1a1a; }
    .small { font: 12px Arial, sans-serif; fill: #333; }
    .frame { fill: none; stroke: #111; stroke-width: 2; }
    .trellis { fill: #e8f1e8; stroke: #2f6b2f; stroke-width: 2; }
    .bed { fill: #f2e6d8; stroke: #8a6e4b; stroke-width: 2; }
    .path { fill: #d9d9d9; stroke: #6b6b6b; stroke-width: 2; }
  </style>

  <!-- Outer boundary: 6m x 10m scaled to 600 x 1000 -->
  <rect x="50" y="50" width="600" height="1000" class="frame" />
  <text x="55" y="40" class="label">SS (South Side, top)</text>
  <text x="55" y="1070" class="label">North (bottom)</text>
  <text x="5" y="80" class="label" transform="rotate(-90, 5, 80)">WS fence</text>
  <text x="660" y="80" class="label" transform="rotate(-90, 660, 80)">ES entrance/open</text>

  <!-- Trellis zone: 2m in from SS, full width -->
  <rect x="50" y="50" width="600" height="200" class="trellis" />
  <text x="60" y="80" class="label">Trellis (2 m in from SS)</text>

  <!-- Long beds start at trellis line, 5m long -->
  <!-- Brassica bed: 2m wide on east side (mirrored) -->
  <rect x="450" y="250" width="200" height="500" class="bed" />
  <text x="460" y="280" class="small">Brassica Bed (2m x 5m)</text>

  <!-- Path: 2m wide -->
  <rect x="250" y="250" width="200" height="500" class="path" />
  <text x="260" y="280" class="small">Path (2m x 5m)</text>

  <!-- Root beds: 1m wide each on west side with a small gap -->
  <rect x="50" y="250" width="95" height="500" class="bed" />
  <text x="55" y="280" class="small">Root Bed A</text>

  <rect x="155" y="250" width="95" height="500" class="bed" />
  <text x="160" y="280" class="small">Root Bed B</text>

  <!-- Additional Allium bed 2x2 north of long beds on east side -->
  <rect x="450" y="750" width="200" height="200" class="bed" />
  <text x="460" y="780" class="small">Allium Bed (2m x 2m)</text>

  <!-- Dimensions labels -->
  <text x="300" y="1020" class="small">6 m width</text>
  <text x="10" y="600" class="small" transform="rotate(-90, 10, 600)">10 m depth</text>
</svg>
